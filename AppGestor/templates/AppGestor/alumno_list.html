
{% extends 'base.html' %}
{% block content %}
  <h2>Listado de Alumnos</h2>
  {% if object_list %}
    <ul>
      {% for alumno in object_list %}
        <li>
          <a href="{% url 'alumno_detail' alumno.pk %}">{{ alumno }}</a>
          - <a href="{% url 'alumno_update' alumno.pk %}">Editar</a>
          - <a href="{% url 'alumno_delete' alumno.pk %}">Borrar</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No hay alumnos aún.</p>
  {% endif %}
  <a href="{% url 'alumno_create' %}">Agregar nuevo alumno</a>
{% endblock %}
