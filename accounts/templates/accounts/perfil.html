
{% extends 'base.html' %}
{% block content %}
  <h2>Mi perfil</h2>
  <p><strong>Usuario:</strong> {{ perfil.user.username }}</p>
  <p><strong>Email:</strong> {{ perfil.user.email }}</p>
  <p><strong>Tipo:</strong> {{ perfil.es_docente|yesno:"Docente,Alumno" }}</p>
  <p><strong>Biografía:</strong> {{ perfil.biografia }}</p>
  {% if perfil.avatar %}
    <img src="{{ perfil.avatar.url }}" alt="Avatar" style="max-width:200px;">
  {% endif %}
  <p><a href="{% url 'editar_perfil' %}">Editar perfil</a></p>
{% endblock %}
